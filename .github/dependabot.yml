# Actions are pinned to commit SHAs in the workflows. Without this file those
# pins never receive security updates; Dependabot rewrites the SHA and the
# trailing version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
