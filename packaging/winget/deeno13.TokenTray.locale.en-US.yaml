ShortDescription: Monitor AI coding-tool usage from the Windows notification area.
Description: >-
  TokenTray is a portable Windows tray app that reads the sessions already stored
  by your installed AI coding tools and shows usage, reset times, and connection
  status in one flyout. Monitoring is read-only: it starts no agent turns, redeems
  no reset credits, and edits no provider configuration. There is no login screen,
  no backend, and no telemetry. Credentials stay in the native layer and are never
  logged, persisted, or sent to the web view. Missing quota is reported as
  unavailable, never as zero. Supported providers include Codex, Claude Code,
  Cursor, Antigravity, GLM, Grok, OpenCode, and GitHub Copilot. Requires the
  Microsoft Edge WebView2 Runtime.
