<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TokenTray</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="flyout" aria-label="AI agent usage limits">
  <header>
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v5h16v-5M7 5h10M7 9h10M9 13h6"/></svg><h1>TokenTray</h1></div>
    <div class="actions"><button id="refresh" aria-label="Refresh usage" title="Refresh usage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button><button id="close" aria-label="Close popup" title="Close popup (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
  </header>
  <div class="intro"><div><h2>Your agent allowances</h2><p>Usage and reset times, at a glance.</p></div><span id="connected">Checking…</span></div>
  <div id="notice" role="status" hidden></div>
  <nav aria-label="Provider filter"><button class="selected" id="all" aria-pressed="true">All agents <span>8</span></button><button id="available" aria-pressed="false">With usage</button></nav>
  <section id="providers" aria-label="Providers"></section>
  <footer><div><span class="local-dot" aria-hidden="true"></span><span id="footer-status">Reads existing local sign-ins</span></div><label title="Use Windows Acrylic when available"><input id="acrylic" type="checkbox" checked> Acrylic</label></footer>
</main>
<script type="module" src="app.mjs"></script>
</body></html>
