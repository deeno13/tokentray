<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TokenTray</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="flyout" aria-label="AI agent usage limits">
  <header>
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v5h16v-5M7 5h10M7 9h10M9 13h6"/></svg><h1>TokenTray</h1></div>
    <div class="actions"><button type="button" id="refresh" aria-label="Refresh usage" title="Refresh usage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button><button type="button" id="settings" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings-page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg></button><button type="button" id="close" aria-label="Close popup" title="Close popup (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
  </header>
  <div id="preview" hidden>Preview · sample data</div>
  <div id="notice" role="status" hidden></div>
  <section id="overview" aria-label="Usage overview"><div id="providers" aria-label="Providers"></div><section id="detail" aria-label="Provider details" hidden></section></section>
  <section id="settings-page" aria-label="Settings" hidden>
    <div class="settings-heading"><button type="button" id="back" aria-label="Back to overview" title="Back to overview (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button><h2>Settings</h2></div>
    <div class="startup-settings">
      <label class="setting"><span class="setting-copy"><span class="setting-name">Start with Windows</span></span><input id="startup" type="checkbox" aria-label="Start with Windows" disabled></label>
      <label class="setting"><span class="setting-copy"><span class="setting-name">Start minimized to tray</span></span><input id="start-minimized" type="checkbox" aria-label="Start minimized to tray" checked></label>
    </div>
    <p class="settings-hint">Choose providers to monitor.</p>
    <div id="provider-settings"></div>
    <label class="setting appearance"><span>Acrylic effect</span><input id="acrylic" type="checkbox" checked></label>
    <div class="setting ring-colors"><span class="setting-copy"><span class="setting-name">Ring color</span><span class="account-details">Tints every provider ring, or keep each brand's own color.</span></span><div id="ring-swatches" role="radiogroup" aria-label="Ring color"></div></div>
    <p class="settings-hint">Changes save automatically.</p>
  </section>
</main><script type="module" src="app.mjs"></script></body></html>
